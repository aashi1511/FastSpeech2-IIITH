path:
  ckpt_path: ./output/ckpt/English
  log_path: ./output/log/English
  result_path: ./output/result/English
optimizer:
  batch_size: 2
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 4000
  anneal_steps:
  - 300000
  - 400000
  - 500000
  anneal_rate: 0.3
step:
  total_step: 10
  log_step: 1
  synth_step: 100
  val_step: 100
  save_step: 10
